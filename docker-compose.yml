name: landauer

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: landauer-gateway:phase9
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - ./deploy/gateway-config:/app/config
      - ./telemetry:/app/telemetry
    environment:
      - LANDAUER_PG_DSN=postgresql://landauer:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/landauer
      - LANDAUER_GPU_METRICS_URL=http://host.docker.internal:8002/metrics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=landauer
      - POSTGRES_DB=landauer
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landauer -d landauer || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # placeholder — later phase
  frontend:
    profiles: ["frontend"]
    image: node:20-alpine
    command: ["echo", "frontend placeholder"]

  # placeholder — later phase
  locust:
    profiles: ["load"]
    image: locustio/locust:2.32.4
    command: ["echo", "locust placeholder"]

volumes:
  pgdata:
